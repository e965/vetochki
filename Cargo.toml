[workspace]
members = ["core", "app"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
publish = false

# Size over speed: the scene is tiny. GNU builds otherwise also keep a multi-MB COFF symbol table.
[profile.release]
strip = true
lto = "fat"
codegen-units = 1
opt-level = "z"
panic = "abort"
