name: release

# Run manually: four native builds and the Android APK in parallel; with a tag given, they are
# published as a GitHub
# release (the tag is created on the built commit if it does not exist). The dependency cache is
# saved by runs on master only and restored by every run.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v0.1.0 (empty = build only)
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-26.04, name: linux-x86_64 }
          - { os: ubuntu-26.04-arm, name: linux-aarch64 }
          - { os: windows-2025, name: windows-x86_64 }
          - { os: windows-11-arm, name: windows-aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Host toolchain of each runner: MSVC on Windows (Visual Studio is preinstalled there; Rust
      # has no aarch64 GNU target for Windows), GNU on Linux.
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - run: cargo test --workspace --release

      - run: cargo build --release -p vetochki

      - name: Package
        shell: bash
        run: |
          mkdir dist
          if [[ "$RUNNER_OS" == Windows ]]; then
            cp target/release/vetochki.exe "dist/vetochki-${{ matrix.name }}.exe"
          else
            tar -czf "dist/vetochki-${{ matrix.name }}.tar.gz" -C target/release vetochki
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: vetochki-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  # Android APK (all four ABIs in one file, debug-signed, see README). The runner image ships an Android SDK; the
  # NDK and platform the build is pinned to are added to it. cargo-apk2 is cached in ~/.cargo/bin.
  android:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Release keystore
        if: inputs.tag != ''
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "CARGO_APK_RELEASE_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "CARGO_APK_RELEASE_KEYSTORE_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"

      - name: Android NDK and platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;37.0.0" "ndk;29.0.14206865" > /dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - run: cargo install cargo-apk2 --locked

      - run: cargo apk2 build -p vetochki-android --release

      - run: mkdir dist && cp target/release/apk/vetochki.apk dist/vetochki-android.apk

      - uses: actions/upload-artifact@v7
        with:
          name: vetochki-android
          path: dist/*
          if-no-files-found: error

  release:
    if: inputs.tag != ''
    needs: [build, android]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # Re-running the workflow re-uploads the files into the existing release.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "$TAG" --generate-notes
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
