name: lint

# rustfmt + clippy (warnings are errors). The code is pure Rust, so the Windows and Android
# targets are checked from the Linux runner too (no NDK needed: nothing is linked).
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc, aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - run: cargo fmt --all -- --check

      - run: cargo clippy --workspace --all-targets -- -D warnings

      - run: cargo clippy --workspace --all-targets --target x86_64-pc-windows-msvc -- -D warnings

      - run: cargo clippy --workspace --all-targets --target aarch64-linux-android -- -D warnings
